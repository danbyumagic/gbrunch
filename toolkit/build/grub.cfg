set timeout=8
set default=1
menuentry 'Try Googlebook OS (prepare trial in Linux first)' {
 if search --no-floppy --label --set=trialroot GBTRIAL_EFI; then
  set root=$trialroot
  configfile /EFI/GBRUNCH/grub.cfg
 else
  echo 'Boot the toolbox, prepare official recovery, then prepare the USB trial.'
  sleep 8
 fi
}
menuentry 'GBRUNCH toolbox: desktop with persistence' {
 linux /live/vmlinuz boot=live components username=live hostname=gbrunch-toolbox persistence persistence-label=GBWORK locales=en_US.UTF-8 keyboard-layouts=us quiet
 initrd /live/initrd.img
}
menuentry 'GBRUNCH toolbox: graphics fallback, no persistence' {
 linux /live/vmlinuz boot=live components username=live hostname=gbrunch-toolbox nomodeset locales=en_US.UTF-8 keyboard-layouts=us
 initrd /live/initrd.img
}
menuentry 'GBRUNCH toolbox: verbose boot, no persistence' {
 linux /live/vmlinuz boot=live components username=live hostname=gbrunch-toolbox locales=en_US.UTF-8 keyboard-layouts=us debug
 initrd /live/initrd.img
}
menuentry 'UEFI firmware settings' { fwsetup }
