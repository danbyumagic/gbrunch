UI menu.c32
DEFAULT toolbox
PROMPT 0
TIMEOUT 80
MENU TITLE GBRUNCH Toolbox v0.3
LABEL toolbox
 MENU LABEL Desktop with persistence
 KERNEL /live/vmlinuz
 APPEND initrd=/live/initrd.img boot=live components username=live hostname=gbrunch-toolbox persistence persistence-label=GBWORK locales=en_US.UTF-8 keyboard-layouts=us quiet
LABEL fallback
 MENU LABEL Graphics fallback without persistence
 KERNEL /live/vmlinuz
 APPEND initrd=/live/initrd.img boot=live components username=live hostname=gbrunch-toolbox nomodeset
